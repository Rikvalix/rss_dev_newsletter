services:
  web:
    build:
      dockerfile: Dockerfile
    restart: always
    networks:
      - default
      - postgres

    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8080/health"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s

    environment:
      - TZ=Europe/Paris
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro

networks:
  default: {}
  postgres:
    external: true
