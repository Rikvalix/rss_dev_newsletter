[package]
name = "tldr_newsletter"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
google-gmail1 = "7.0.0+20251215"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros"] }
regex = "1.12.3"
strum_macros = "0.28.0"
strum = "0.28"
serde = { version = "1.0.228", features = ["derive"] }
config = "0.15.22"
log = "0.4.29"
env_logger = "0.11.10"
gemini-rust = "1.7.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.150"
rustls = "0.23.38"
mime = "0.3.17"
mistralai-client = "0.14.0"
rss = "2.1.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres","migrate","chrono"]}
sha2 = "0.11.0"
hex = "0.4.3"
